<app-navbar></app-navbar>
<app-back-btn/>

<section class="product-detail" *ngIf="producto">
  <div class="detail-grid animate-on-scroll from-left">
    <div class="carrusel">
      <swiper-container
        slides-per-view="1"
        autoplay='{"delay":2000,"disableOnInteraction":false}'
        loop="true"
        class="product-swiper"
>
        <swiper-slide *ngFor="let img of producto.gallery || [producto.imageUrl, producto.hoverImageUrl]">
          <img [src]="img" [alt]="producto.title" />
        </swiper-slide>
      </swiper-container>
    </div>

    <div class="info-container">
      <h2>{{ producto.title }}</h2>

      <div class="badges">
        <span class="badge" *ngFor="let tag of producto.tags">{{ tag }}</span>
        <i *ngIf="producto.icon" class="icon">{{ producto.icon }}</i>
      </div>

      <div class="description" [innerHTML]="producto.description"></div>

      <div class="tabs" *ngIf="producto.tabGroups">
        <button
          *ngFor="let tab of producto.tabGroups"
          [class.active]="activeTab === tab.label.toLowerCase()"
          (click)="activeTab = tab.label.toLowerCase()"
        >
          {{ tab.label }}
        </button>
      </div>

      <!-- Lista de sabores según tab -->
      <div
        class="grupo"
        *ngFor="let tab of producto.tabGroups"
        [hidden]="activeTab !== tab.label.toLowerCase()"
      >
        <h3> {{ tab.label }} </h3>

        <p class="tab-description" *ngIf="tab.description">{{ tab.description }}</p>

        <ul>
          <li *ngFor="let sabor of tab.sabores">{{ sabor }}</li>
        </ul>
        
        <div *ngIf="tab.price" class="tab-price-group">
        <div *ngFor="let key of getPriceKeys(tab.price)">
          <span class="presentation">{{ key | titlecase }}:</span>
          <span class="amount">{{ tab.price[key] }}</span>
        </div>
      </div>

    </div>

    <div class="price-container" *ngIf="producto.priceGrande || producto.priceChico">
          <div class="price" *ngIf="producto.priceGrande">
            <i class="icon ri-pie-chart-line"></i>
            <p>Precio Grande:${{ producto.priceGrande }}</p>
          </div>
          <div class="price" *ngIf="producto.priceChico">
            <i class="icon ri-pie-chart-line"></i>
            <p>Precio Chico:${{ producto.priceChico }}</p>
          </div>
    </div>
      
      <button class="btn" (click)="abrirWhatsapp()">Hacé tu pedido</button>
    </div>
  </div>
</section>
